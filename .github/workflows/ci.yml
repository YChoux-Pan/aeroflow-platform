name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Install build dependencies
        working-directory: plugin/tools
        run: pnpm install --frozen-lockfile

      - name: Rebuild client bundle
        run: node plugin/tools/build.mjs

      - name: Check bundle is committed and current
        run: git diff --exit-code -- plugin/client.js

      - name: Import smoke test
        run: node plugin/tools/run-import-smoke.mjs

      - name: Repository verification
        run: node scripts/verify.mjs

      - name: Package plugin
        run: node scripts/package-plugin.mjs
